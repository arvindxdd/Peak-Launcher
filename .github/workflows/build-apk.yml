name: Build CanvasHome APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          if [ -z "$(find . -name 'settings.gradle.kts' -print -quit)" ]; then
            for z in *.zip; do
              [ -f "$z" ] && unzip -o "$z"
            done
          fi
          PROJECT_DIR=$(dirname "$(find . -name 'settings.gradle.kts' -print -quit)")
          echo "Building from: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload CanvasHome APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanvasHome-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          retention-days: 30
